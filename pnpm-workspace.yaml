packages: []

# Force patched versions of transitive deps with HIGH advisories
# (zod GHSA-mrhx-c7xc-m3w5, body-parser GHSA-27r3-jxmh-p828).
# These remediate rather than suppress: pnpm audit reports no known
# vulnerabilities. Remove an entry once every dependent requires a
# patched version on its own.
# Moved here from package.json "pnpm.overrides" because pnpm 11 no
# longer reads the "pnpm" field in package.json (pnpm 10 still reads it
# but warns); pnpm-workspace.yaml is the supported home on pnpm 10+.
overrides:
  zod: 4.6.7
  body-parser: 2.4.0

allowBuilds:
  esbuild: true
  tesseract.js: true
# picomatch has no patched release yet; this advisory affects the dev-only
# Vitest graph. Keep the advisory explicit so all other audit failures remain
# blocking, and remove these entries when an upstream fix is available.
auditConfig:
  ignoreCves:
    - GHSA-fc5q-39xc-vjpf
    - CVE-2026-112366
