packages: []

# Force patched versions of transitive deps with HIGH advisories
# (zod GHSA-mrhx-c7xc-m3w5, body-parser GHSA-27r3-jxmh-p828).
# These remediate rather than suppress: pnpm audit reports no known
# vulnerabilities. Remove an entry once every dependent requires a
# patched version on its own.
# Moved here from package.json "pnpm.overrides" because pnpm 10.18+ no
# longer reads the "pnpm" field in package.json.
overrides:
  zod: 4.6.7
  body-parser: 2.4.0

allowBuilds:
  esbuild: true
  tesseract.js: true
