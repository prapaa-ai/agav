packages: []

allowBuilds:
  esbuild: true
  workerd: true

# Current Cloudflare toolchain releases; kept scoped to these versions.
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20261003.1'
  - wrangler@4.147.0

# Force patched versions of transitive deps with open advisories
# (vite via vitest, undici and sharp via wrangler>miniflare).
# Remove an entry once every dependent requires a patched version on its own.
overrides:
  vite: ^8.3.5
  undici: ^7.30.1
  sharp: ^0.35.5
