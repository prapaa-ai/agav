name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for Agav? Describe it below.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve, or what workflow does it improve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Include CLI examples if applicable.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why they're less ideal.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI / flags
        - Interactive TUI
        - Agent behavior
        - Tools (file, shell, search)
        - Provider support
        - Performance
        - Documentation
        - Other
    validations:
      required: true
