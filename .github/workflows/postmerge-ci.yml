name: Post-Merge CI

on:
  push:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  full-test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.TOKEN }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx vitest run --passWithNoTests
      - name: Check clean worktree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Build modified source files:"
            git diff --name-only
            exit 1
          fi

  binary-smoke:
    name: Binary Smoke Test (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      # Validate the pinned Bun AND its vendored C libraries (Brotli, c-ares,
      # zlib, libarchive) against their advisory floors before compiling: the
      # binary statically embeds them, so building with a known-vulnerable
      # runtime would produce a vulnerable artifact. Runs after install so it can
      # parse workflow YAML with the real `yaml` parser. Fail-closed.
      - name: Validate embedded runtime against advisory floors
        run: node scripts/check-bun-advisories.mjs
      - run: bun install react-devtools-core
      - name: Build binary
        run: bun build source/cli.tsx --compile --outfile /tmp/agav-test
      - name: Smoke test binary
        run: |
          /tmp/agav-test --version
          /tmp/agav-test --help | grep -q "Agav"
          echo "Binary smoke test passed."
      # Prove the compiled artifact embeds exactly the pinned Bun (the version the
      # advisory gate above vetted). Trivy is deliberately NOT used on the binary:
      # it cannot advisory-match Bun's statically linked C libraries from an SBOM
      # (its CycloneDX decoder keys on PURL ecosystem, has no CPE path, and skips
      # pkg:generic), so such a scan would pass while scanning nothing. The
      # component advisories are enforced by check-bun-advisories.mjs instead.
      - name: Verify the binary embeds the pinned Bun runtime
        run: node scripts/verify-embedded-runtime.mjs /tmp/agav-test

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.TOKEN }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: |
          npx license-checker --production --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;CC0-1.0;CC-BY-4.0;Unlicense;Python-2.0;BlueOak-1.0.0' \
            --excludePrivatePackages 2>/dev/null || echo "::warning::Non-standard licenses found"

  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.TOKEN }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - name: Generate SBOM
        run: |
          npx @cyclonedx/cyclonedx-npm --output-file sbom.json --output-format JSON 2>/dev/null || \
            pnpm licenses list --json > sbom.json 2>/dev/null || \
            echo '{"notice": "SBOM generation skipped"}' > sbom.json
          echo "SBOM generated: $(wc -c < sbom.json) bytes"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  # Agav ships standalone compiled binaries, not a container image, so scanning
  # an unrelated base image (node:22-slim) told us nothing about the product and
  # was report-only besides. Scan the resolved dependency filesystem instead —
  # the real surface that reaches users — and fail-closed on HIGH/CRITICAL. The
  # compiled binary itself is scanned in binary-smoke.
  dependency-fs-scan:
    name: Dependency Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.TOKEN }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - name: Scan resolved dependencies for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

  file-size:
    name: File Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.TOKEN }}
      - name: Check for large files
        run: |
          for f in $(find source -name '*.ts' -o -name '*.tsx' | sort); do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 500 ]; then
              echo "::warning file=$f::$f has $lines lines (limit: 500)"
            fi
          done

  dependency-pinning:
    name: Dependency Pinning Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.TOKEN }}
      - name: Check for unpinned dependencies
        run: |
          for field in dependencies devDependencies; do
            if node -e "
              const pkg = require('./package.json');
              const deps = pkg['$field'] || {};
              let found = false;
              for (const [name, version] of Object.entries(deps)) {
                if (/^[\^~]/.test(version) && !version.includes('workspace:')) {
                  console.log('  ' + name + ': ' + version);
                  found = true;
                }
              }
              process.exit(found ? 1 : 0);
            " 2>/dev/null; then
              :
            else
              echo "::warning::Unpinned $field found — consider exact versions"
            fi
          done

  commit-signing:
    name: Commit Signing Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.TOKEN }}
          fetch-depth: 10
      - name: Check recent commit signatures
        run: |
          UNSIGNED=0
          TOTAL=0
          for sha in $(git log --format='%H' -10); do
            TOTAL=$((TOTAL + 1))
            SIG=$(git log --format='%G?' -1 "$sha" 2>/dev/null)
            case "$SIG" in
              G|U) ;;
              *) UNSIGNED=$((UNSIGNED + 1)) ;;
            esac
          done
          if [ "$UNSIGNED" -gt 0 ]; then
            echo "::warning::$UNSIGNED of $TOTAL recent commits are unsigned"
          fi
