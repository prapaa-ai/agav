name: PR Checks

on:
  pull_request:
    branches: [main, beta]

# Least privilege: default every job to read-only source access. The only job
# that needs more (pr-title reads PR metadata) declares `pull-requests: read`
# itself. No job uploads SARIF, so `security-events: write` is not granted.
permissions:
  contents: read

jobs:
  # --- Change detection ---
  changed:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.diff.outputs.source }}
      workflows: ${{ steps.diff.outputs.workflows }}
      docs: ${{ steps.diff.outputs.docs }}
      deps: ${{ steps.diff.outputs.deps }}
      scripts: ${{ steps.diff.outputs.scripts }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.TOKEN || github.token }}
          fetch-depth: 0
      - name: Compute changed paths
        id: diff
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FILES=$(git diff --name-only "$BASE" "$HEAD")
          echo "source=false" >> "$GITHUB_OUTPUT"
          echo "workflows=false" >> "$GITHUB_OUTPUT"
          echo "docs=false" >> "$GITHUB_OUTPUT"
          echo "deps=false" >> "$GITHUB_OUTPUT"
          echo "scripts=false" >> "$GITHUB_OUTPUT"
          if echo "$FILES" | grep -qE '^source/'; then
            echo "source=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$FILES" | grep -qE '^\.github/'; then
            echo "workflows=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$FILES" | grep -qE '(README|\.md$|docs/)'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$FILES" | grep -qE '(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)'; then
            echo "deps=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$FILES" | grep -qE '^scripts/'; then
            echo "scripts=true" >> "$GITHUB_OUTPUT"
          fi

  # --- Core checks (only when source or deps change) ---
  typecheck:
    name: Type Check
    needs: changed
    if: needs.changed.outputs.source == 'true' || needs.changed.outputs.deps == 'true' || needs.changed.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit
      - name: Check clean worktree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Build modified source files:"
            git diff --name-only
            exit 1
          fi

  build:
    name: Build Check
    needs: changed
    if: needs.changed.outputs.source == 'true' || needs.changed.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - run: pnpm install --frozen-lockfile
      - run: npx tsx source/cli.tsx --version
      - name: Check clean worktree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Build modified source files:"
            git diff --name-only
            exit 1
          fi

  test:
    name: Tests
    needs: changed
    # Also run on workflow-only changes: the CI-hardening suite (SHA pins +
    # permissions) lives here, so a PR touching only .github/workflows must still
    # execute it or a mutable action ref could slip in unguarded.
    if: needs.changed.outputs.source == 'true' || needs.changed.outputs.deps == 'true' || needs.changed.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # `pnpm build` regenerates the bundled-skills manifest. If that changed
      # anything, the committed copy was stale — which a source checkout and
      # `bun build` both use as-is. Fail here rather than ship the old text.
      - name: Check bundled skills manifest is up to date
        run: |
          if ! git diff --exit-code -- source/skills/bundled-manifest.ts; then
            echo "::error::source/skills/bundled-manifest.ts is stale. Run 'pnpm gen:skills' and commit the result."
            exit 1
          fi
      - run: npx vitest run --passWithNoTests

  binary-size:
    name: Binary Size
    needs: changed
    if: needs.changed.outputs.source == 'true' || needs.changed.outputs.deps == 'true' || needs.changed.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.TOKEN || github.token }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      # Only pnpm, deliberately: the release workflow no longer runs a separate
      # `bun install react-devtools-core`, so this is the check that the ink
      # devtools import still resolves through pnpm's peer layout. A compiled
      # binary that cannot find it dies at startup, not at build time, which is
      # exactly the class of break that used to reach a release.
      - run: pnpm install --frozen-lockfile
      # Mirror the release: it regenerates the inlined bundled skills before
      # compiling, so measuring without them would understate what ships.
      - run: node scripts/gen-bundled-skills.mjs
      - name: Compile and measure
        run: |
          # Same target and flags the release uses, so the number here is the
          # number users download. linux-x64 stands in for the matrix: the
          # difference between targets is the embedded Bun runtime, which no
          # pull request can change.
          mkdir -p dist
          bun build source/cli.tsx --compile --target=bun-linux-x64 --outfile dist/agav-linux-x64
          gzip -9 -k -n dist/agav-linux-x64

          RAW=$(wc -c < dist/agav-linux-x64)
          GZ=$(wc -c < dist/agav-linux-x64.gz)
          # ~114 MiB of this is the embedded Bun runtime (1.4.4) and is not ours
          # to shrink; the runtime grew when the Brotli-CVE fix moved the pin up
          # from 1.3.14. The budget leaves room for a few MB of growth and trips
          # on the kind of regression that added 30 MB of native image codecs.
          # Raise it in lockstep with a Bun pin bump that legitimately grows the
          # runtime, never to accommodate our own bloat.
          BUDGET=$((125 * 1024 * 1024))

          {
            echo "| Asset | Bytes | MiB |"
            echo "| --- | ---: | ---: |"
            echo "| agav-linux-x64 | $RAW | $((RAW / 1048576)) |"
            echo "| agav-linux-x64.gz | $GZ | $((GZ / 1048576)) |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$RAW" -gt "$BUDGET" ]; then
            echo "::error::agav-linux-x64 is $RAW bytes, over the $BUDGET byte budget."
            exit 1
          else
            echo "agav-linux-x64: $RAW bytes (budget $BUDGET), compressed $GZ bytes."
          fi
      - name: Smoke-test the compiled binary
        # A binary that builds but cannot start is the failure this job exists
        # to catch, and --version exercises the whole module graph's top level.
        run: ./dist/agav-linux-x64 --version

  # --- Installer scripts ---
  # These ship outside the release pipeline (hand-copied to agav.dev), so
  # nothing else in this workflow would ever look at them.
  installer-sh:
    name: Installer Tests (sh)
    needs: changed
    if: needs.changed.outputs.scripts == 'true' || needs.changed.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.TOKEN || github.token }}
      - name: ShellCheck
        run: |
          shellcheck -s sh \
            scripts/install.sh \
            scripts/tests/install-sh.test.sh \
            scripts/tests/install-sh-path.test.sh \
            scripts/tests/run-installer-tests.sh
      - name: Install the other /bin/sh implementations
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends dash busybox
      - name: Run the suites under every shell
        # install.sh is `#!/bin/sh`, and which shell that is depends entirely on
        # the distro: dash on Debian and Ubuntu, bash on Fedora, ash in Alpine.
        run: |
          FAIL=0
          for shell in dash bash "busybox sh"; do
            echo "::group::$shell"
            $shell scripts/tests/install-sh.test.sh || FAIL=1
            $shell scripts/tests/install-sh-path.test.sh || FAIL=1
            echo "::endgroup::"
          done
          if [ "$FAIL" -eq 1 ]; then exit 1; fi

  installer-ps1:
    name: Installer Tests (PowerShell)
    needs: changed
    if: needs.changed.outputs.scripts == 'true' || needs.changed.outputs.workflows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.TOKEN || github.token }}
      - name: Suites under Windows PowerShell 5.1
        # This is the host install.cmd actually launches, and the only place the
        # registry half of the PATH handling runs for real. The suite captures
        # HKCU\Environment\PATH first and puts it back afterwards.
        shell: powershell
        run: |
          $Fail = 0
          foreach ($Suite in @("install-ps1.test.ps1", "install-ps1-path.test.ps1")) {
            Write-Host "::group::5.1 $Suite"
            & powershell -NoProfile -File "scripts\tests\$Suite"
            if ($LASTEXITCODE -ne 0) { $Fail = 1 }
            Write-Host "::endgroup::"
          }
          exit $Fail
      - name: Suites under pwsh 7
        shell: pwsh
        run: |
          $Fail = 0
          foreach ($Suite in @("install-ps1.test.ps1", "install-ps1-path.test.ps1", "install-ps1-lint.test.ps1")) {
            Write-Host "::group::pwsh $Suite"
            & pwsh -NoProfile -File "scripts\tests\$Suite"
            if ($LASTEXITCODE -ne 0) { $Fail = 1 }
            Write-Host "::endgroup::"
          }
          exit $Fail

  # --- Always-run checks ---
  pr-title:
    name: PR Title Lint
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN || github.token }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            chore
            test
            perf
            ci
          requireScope: false

  # NOTE: content-based secret detection now lives in secret-scan.yml (Gitleaks),
  # which scans the PR commit range and, on push/schedule, the full history —
  # replacing the former regex `secret-scan` job that only matched a handful of
  # fixed key formats in a few file types. Tracked credential files are still
  # covered by the `sensitive-files` job below.

  blob-size:
    name: Blob Size Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.TOKEN || github.token }}
          fetch-depth: 0
      - name: Check for oversized files
        run: |
          MAX_BYTES=512000
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FAIL=0
          for file in $(git diff --name-only --diff-filter=ACM "$BASE" "$HEAD"); do
            if [ -f "$file" ]; then
              size=$(wc -c < "$file")
              if [ "$size" -gt "$MAX_BYTES" ]; then
                echo "::error file=$file::$file is ${size} bytes (max: ${MAX_BYTES})"
                FAIL=1
              fi
            fi
          done
          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          echo "All files within size limits."

  security-patterns:
    name: Dangerous Pattern Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.TOKEN || github.token }}
      - name: Scan for dangerous code patterns
        run: |
          echo "Scanning for dangerous patterns in source..."
          FAIL=0
          # Drop lines that are ENTIRELY a comment so doc comments merely
          # mentioning a pattern (e.g. "never use eval()") don't trigger false
          # positives. grep -n output is "file:lineno:content"; we anchor on that
          # prefix and only strip when the code content itself begins with a
          # comment marker (*, //, /*). Real code with an inline comment such as
          # `run: /* x */ eval(z)` is NOT stripped, so it is still flagged.
          strip_comments() { grep -vE '^[^:]+:[0-9]+:[[:space:]]*(\*|//|/\*)'; }
          if grep -rn --include='*.ts' --include='*.tsx' \
            -E '\beval\s*\(|new\s+Function\s*\(' source/ 2>/dev/null | grep -v 'node_modules' | grep -v '\.test\.' | strip_comments; then
            echo "::error::eval() or new Function() found — code injection risk"
            FAIL=1
          fi
          if grep -rn --include='*.ts' --include='*.tsx' \
            -E 'exec(File|Sync|Async)?\s*\(\s*`' source/ 2>/dev/null | grep -v 'node_modules' | strip_comments; then
            echo "::error::Shell exec with template literal — command injection risk"
            FAIL=1
          fi
          if grep -rn --include='*.ts' --include='*.tsx' \
            -E 'rejectUnauthorized\s*:\s*false|NODE_TLS_REJECT_UNAUTHORIZED.*0' source/ 2>/dev/null \
            | grep -v 'cli.tsx' | strip_comments; then
            echo "::error::TLS verification disabled — MITM risk"
            FAIL=1
          fi
          if grep -rn --include='*.ts' --include='*.tsx' \
            -E 'innerHTML|dangerouslySetInnerHTML' source/ 2>/dev/null | strip_comments; then
            echo "::error::innerHTML usage found — XSS risk"
            FAIL=1
          fi
          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          echo "No dangerous patterns detected."

  # Always runs: a new advisory can raise the Bun floor with no file change in
  # the PR, and the embedded runtime ships to users regardless of what this PR
  # touches. The embedded Bun runtime (and its vendored C libraries such as
  # Brotli) is invisible to pnpm audit / SBOM / Semgrep, so this is the only
  # gate that maps the pinned Bun version to known advisories. Fail-closed.
  runtime-audit:
    name: Embedded Runtime Advisory Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      # The gate parses workflow YAML with the real `yaml` parser (a prod dep);
      # install it from the lockfile first so validation is correct, not a
      # fragile hand-rolled scanner.
      - run: pnpm install --frozen-lockfile
      - name: Validate pinned Bun against advisory floor
        run: node scripts/check-bun-advisories.mjs
      - name: Enforce runtime policy review deadline
        run: node scripts/check-runtime-security.mjs

  dependency-audit:
    name: Dependency Vulnerability Audit
    needs: changed
    if: needs.changed.outputs.deps == 'true' || needs.changed.outputs.source == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - run: pnpm install --frozen-lockfile
      # Fail-closed on known production vulnerabilities. Enterprise posture: a
      # shipped dependency CVE blocks the merge rather than emitting a warning
      # that every green run quietly ignores. `--audit-level high` keeps low and
      # moderate advisories out of the gate while blocking high and critical.
      - run: pnpm audit --prod --audit-level high

  # Supply-chain gate on dependency changes. Fail-closed on a new direct or
  # transitive dependency carrying a HIGH/CRITICAL advisory or a disallowed
  # license — caught at the PR that introduces it, before it reaches the
  # lockfile that `pnpm audit` later re-checks at release. The license allow
  # list mirrors the postmerge license-check job so the two cannot drift. Only
  # runs when the dependency manifest/lockfile changes; the comparison is
  # between the PR base and head so unchanged deps are never re-flagged.
  dependency-review:
    name: Dependency Review
    needs: changed
    if: needs.changed.outputs.deps == 'true'
    runs-on: ubuntu-latest
    # pull-requests:write is required for `comment-summary-in-pr: on-failure`;
    # without it the action catches the 403 and only warns, silently dropping
    # the summary. contents:read is the default, kept explicit alongside it.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.TOKEN || github.token }}
      - name: Review dependency changes
        id: review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}
          fail-on-severity: high
          # Keep in lockstep with the postmerge license-check allow list.
          allow-licenses: >-
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, CC0-1.0,
            CC-BY-4.0, Unlicense, Python-2.0, BlueOak-1.0.0
          comment-summary-in-pr: on-failure
      # Fail closed on licenses the action cannot resolve. With an allow-list
      # set, the action hard-fails `forbidden` and `unresolved` license changes,
      # but it only *logs* dependencies whose license is unknown/NOASSERTION —
      # so a new runtime dependency with no identifiable license would pass
      # despite not being on the allow-list. Enforce that gap here by reading
      # the action's `invalid-license-changes` output (which includes the
      # `unlicensed` bucket) and failing if it is non-empty. Runs even when the
      # action step above failed, so one finding does not mask the other.
      - name: Fail on unresolved or unlicensed dependencies
        if: always() && steps.review.outputs.invalid-license-changes != ''
        env:
          INVALID: ${{ steps.review.outputs.invalid-license-changes }}
        run: |
          UNLICENSED=$(node -e '
            const data = JSON.parse(process.env.INVALID || "{}");
            const bad = [...(data.unlicensed || []), ...(data.unresolved || [])];
            for (const d of bad) console.log(`  ${d.package_url || d.name || "unknown"}`);
            process.exit(bad.length > 0 ? 1 : 0);
          ') && {
            echo "No unlicensed or unresolved dependency changes."
            exit 0
          }
          echo "::error::Dependency change(s) with an unknown/unresolved license (not on the allow-list):"
          printf '%s\n' "$UNLICENSED"
          exit 1

  lockfile-integrity:
    name: Lockfile Integrity
    needs: changed
    if: needs.changed.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.TOKEN || github.token }}
      - name: Verify lockfile exists
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::error::pnpm-lock.yaml missing"
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - run: pnpm install --frozen-lockfile

  semgrep:
    name: SAST (Semgrep)
    needs: changed
    # Also run on scripts changes: the build/release/SBOM/advisory scripts run in
    # CI with repo-write privileges, so a command-injection or unsafe-exec defect
    # there is as dangerous as one in the shipped CLI. They were previously
    # unscanned.
    if: needs.changed.outputs.source == 'true' || needs.changed.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    container:
      # Pinned by digest, not `:latest`: a mutable tag could be moved to a build
      # that changes or disables the scan. semgrep/semgrep:1.183.0.
      image: semgrep/semgrep@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.TOKEN || github.token }}
      - run: |
          semgrep scan \
            --config "p/javascript" \
            --config "p/typescript" \
            --config "p/owasp-top-ten" \
            --config "p/nodejs" \
            --config "p/command-injection" \
            --config "p/xss" \
            --error \
            source/ scripts/

  # GitHub Actions static analysis. actionlint catches workflow syntax/expression
  # errors and shellcheck issues in `run:` blocks; zizmor finds Actions-specific
  # security defects (template injection via untrusted ${{ }} interpolation,
  # over-broad GITHUB_TOKEN permissions, credential persistence, untrusted
  # checkout of PR code, mutable action refs). This is the gap SAST on source/
  # never covered: a workflow compromise can exfiltrate secrets or tamper with a
  # release even when the application code is clean. Runs on any .github change.
  # Both tools are pinned (actionlint: checksum-verified release binary; zizmor:
  # container by digest), never a mutable tag.
  workflow-lint:
    name: Workflow Security (actionlint + zizmor)
    needs: changed
    if: needs.changed.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      # linux_amd64 tarball SHA-256 from the v1.7.12 release checksums. Bump in
      # lockstep with ACTIONLINT_VERSION; a mismatch fails the install closed.
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.TOKEN || github.token }}
          persist-credentials: false
      - name: Install actionlint (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 -o "$tarball" "$url"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" actionlint
          chmod +x actionlint
          ./actionlint --version
      - name: actionlint
        # shellcheck is preinstalled on ubuntu-latest, so run: block linting works.
        run: ./actionlint -color
      - name: zizmor (pinned by digest)
        # Run the official zizmor container by digest. GH_TOKEN lets zizmor's
        # online audits (impostor-commit, stale action refs) query the API;
        # contents:read is sufficient.
        #
        # --min-severity high fails the gate on the genuinely dangerous class —
        # template injection from untrusted ${{ }}, credential exfiltration,
        # unscoped app-token permissions — which is this batch's target. The
        # remaining lower-severity findings (e.g. `artipacked`: checkout without
        # persist-credentials: false) are real hygiene items but pre-exist across
        # the repo; sweeping all of them is a separate follow-up, not a reason to
        # block every PR here. Raise the threshold in a later pass once they are
        # cleared.
        env:
          GH_TOKEN: ${{ secrets.TOKEN || github.token }}
        # zizmorcore/zizmor:1.31.1
        run: |
          docker run --rm \
            -e GH_TOKEN \
            -v "${{ github.workspace }}:/src:ro" \
            ghcr.io/zizmorcore/zizmor@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9 \
            --persona regular \
            --min-severity high \
            /src/.github/workflows

  sensitive-files:
    name: Sensitive File Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.TOKEN || github.token }}
      - name: Check sensitive files are not tracked
        run: |
          FAIL=0
          PATTERNS=('.env' '.env.local' '.env.production' '*.pem' '*.key' '*.p12' '*.pfx'
                    'credentials.json' 'service-account.json' 'id_rsa' 'id_ed25519')
          for pattern in "${PATTERNS[@]}"; do
            matches=$(git ls-files "$pattern" 2>/dev/null)
            if [ -n "$matches" ]; then
              echo "::error::Sensitive file tracked: $matches"
              FAIL=1
            fi
          done
          # Also flag an untracked `.env` sitting in the worktree. Gitleaks scans
          # git history, not an uncommitted file, so this guards the window before
          # such a file is (accidentally) committed. Carried over from the former
          # regex secret-scan job.
          if find . -name '.env' -not -path '*/node_modules/*' -not -path '*/.git/*' | grep -q .; then
            echo "::error::Found untracked .env file(s) — these should be gitignored"
            FAIL=1
          fi
          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          echo "No sensitive files tracked."

  readme-badges:
    name: README Badge Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.TOKEN || github.token }}
      - name: Check the version badge is derived, not hardcoded
        run: |
          # A literal shields.io/badge/version-x.y.z badge has to be rewritten
          # on every release. The release workflow used to do that by pushing
          # to main, the ruleset rejected it, and the badge sat at 0.1.2 for
          # six releases. Keep the badge derived from package.json instead.
          if grep -nE 'img\.shields\.io/badge/version-' README.md; then
            echo "::error file=README.md::Hardcoded version badge. Use https://img.shields.io/github/package-json/v/${{ github.repository }} so the badge tracks package.json."
            exit 1
          fi
          if ! grep -q 'img\.shields\.io/github/package-json/v/' README.md; then
            echo "::error file=README.md::The derived version badge is missing from README.md."
            exit 1
          fi
          echo "Version badge is derived from package.json."

  # --- Terminal gate ---
  required:
    name: All Checks
    if: always()
    needs:
      - typecheck
      - build
      - test
      - binary-size
      - installer-sh
      - installer-ps1
      - pr-title
      - blob-size
      - security-patterns
      - runtime-audit
      - dependency-audit
      - dependency-review
      - lockfile-integrity
      - semgrep
      - workflow-lint
      - sensitive-files
      - readme-badges
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        run: |
          echo "Check results:"
          FAIL=0
          for result in \
            "${{ needs.typecheck.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.binary-size.result }}" \
            "${{ needs.installer-sh.result }}" \
            "${{ needs.installer-ps1.result }}" \
            "${{ needs.pr-title.result }}" \
            "${{ needs.blob-size.result }}" \
            "${{ needs.security-patterns.result }}" \
            "${{ needs.runtime-audit.result }}" \
            "${{ needs.dependency-audit.result }}" \
            "${{ needs.dependency-review.result }}" \
            "${{ needs.lockfile-integrity.result }}" \
            "${{ needs.semgrep.result }}" \
            "${{ needs.workflow-lint.result }}" \
            "${{ needs.sensitive-files.result }}" \
            "${{ needs.readme-badges.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::Check failed: $result"; FAIL=1 ;;
            esac
          done
          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          echo "All checks passed."
