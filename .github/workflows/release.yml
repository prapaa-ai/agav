name: Release

on:
  push:
    branches: [main, beta]
  # Manual recovery entry point. Lets an operator re-run a release for the
  # version currently in package.json without a new commit (e.g. after a
  # transient infra failure), and - with force - rebuild and overwrite a
  # release that already published but shipped a bad asset. See
  # docs/deploy/release-recovery.md.
  workflow_dispatch:
    inputs:
      force:
        description: "Re-release the current package.json version even if a non-draft GitHub Release already exists"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check-version:
    name: Check Version Change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          token: ${{ secrets.TOKEN }}
          fetch-depth: 2
      # Publish-gap detection, not a HEAD~1 diff. The release runs whenever the
      # committed package.json version has no completed (non-draft) GitHub
      # Release yet - so a same-version fix commit (or a manual re-run) after a
      # failed pipeline re-triggers automatically until the release actually
      # lands, and a version that already published cleanly never re-releases.
      # See docs/deploy/release-recovery.md for the full rationale.
      - name: Detect unreleased version
        id: version
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./package.json').version")
          # Validate version format up front - a malformed version must fail the
          # release regardless of trigger, not be silently skipped.
          if ! echo "$CURRENT" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+(\.[0-9]+)?)?$'; then
            echo "::error::Invalid version format: $CURRENT. Expected: x.y.z or x.y.z-beta.N"
            exit 1
          fi
          TAG="v$CURRENT"

          # Look up an existing GitHub Release for this exact tag. A draft counts
          # as "not released" so an interrupted run that left a draft is
          # completed rather than treated as done. Distinguish 404 (no release)
          # from genuine API errors so a transient API failure fails closed
          # instead of silently publishing.
          if gh api "repos/${{ github.repository }}/releases/tags/$TAG" \\
               --jq '.draft' > /tmp/rel_draft 2>/tmp/rel_err; then
            if [ "$(cat /tmp/rel_draft)" = "false" ]; then
              RELEASED=true
            else
              RELEASED=false   # draft release -> finish it
            fi
          elif grep -q "Not Found" /tmp/rel_err; then
            RELEASED=false      # no release yet -> publish it
          else
            echo "::error::Could not determine release state for $TAG:"
            cat /tmp/rel_err
            exit 1
          fi

          # Downgrade guard: never auto-release a version older than the latest
          # published release (e.g. package.json was reverted). An explicit bump
          # is required; force overrides this for deliberate operator recovery.
          if [ "$RELEASED" = "false" ] && [ "$FORCE" != "true" ]; then
            LATEST=$(gh api "repos/${{ github.repository }}/releases/latest" \\
              --jq '.tag_name' 2>/dev/null || echo "")
            if [ -n "$LATEST" ]; then
              HIGHEST=$(printf '%s\n%s\n' "$CURRENT" "${LATEST#v}" | sort -V | tail -1)
              if [ "$HIGHEST" = "${LATEST#v}" ] && [ "${LATEST#v}" != "$CURRENT" ]; then
                echo "::error::package.json version $CURRENT is older than the latest release $LATEST. Bump the version, or re-run with force to override."
                exit 1
              fi
            fi
          fi

          if [ "$FORCE" = "true" ]; then
            RELEASED=false
            echo "Force re-release requested for $TAG."
          fi

          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          # Versions with a hyphen suffix (e.g. 0.2.0-beta.1) are pre-releases.
          if echo "$CURRENT" | grep -q '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$RELEASED" = "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "$TAG already published (non-draft). Nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$TAG has no completed release yet - proceeding."
          fi
      # Fail the prerequisite job before any binary is built: the compiled
      # release embeds the Bun runtime, so a Bun below the advisory floor would
      # ship a vulnerable artifact to every user. Unconditional and fail-closed.
      # The gate parses workflow YAML with the real `yaml` parser (a prod dep),
      # so install dependencies from the lockfile first.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - run: pnpm install --frozen-lockfile
      - name: Validate pinned Bun against advisory floor
        run: node scripts/check-bun-advisories.mjs
      # The voice-enabled binary statically links whisper.cpp (+ bundled ggml) and
      # miniaudio; a version below their advisory floors would ship a vulnerable
      # voice helper. Block the whole release here, before any binary is built.
      - name: Validate native voice components against advisory floors
        run: node scripts/check-voice-advisories.mjs
      # Fail the prerequisite job before spending time building stable binaries.
      - name: Validate reviewed release notes
        if: steps.version.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-notes.mjs validate "$VERSION"

  # Audit the release commit's production dependencies, fail-closed on HIGH/
  # CRITICAL. The PR-time audit cannot cover advisories disclosed between PR
  # validation and release, so publication must re-check the exact commit being
  # shipped. build-binaries and release both depend on this.
  dependency-audit:
    name: Dependency Vulnerability Audit
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          token: ${{ secrets.TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      # Also re-check the dev/build dependency graph at the exact release commit:
      # a compromised build tool (tsx, vitest, tsc, ...) could tamper with the
      # artifact produced here even though it never ships. Fail-closed, same floor.
      - run: pnpm audit --dev --audit-level high
      - name: Check fresh runtime policy and live upstream advisories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-runtime-security.mjs --live

  # Produce the authoritative, attested, published SBOM for the EXACT release
  # commit. The postmerge SBOM job is for merge-time visibility only (artifact,
  # 90-day retention, mutable tag); this one is the record of record for the
  # shipped version. It is a CycloneDX software bill of materials over the
  # resolved production dependency graph, published as a release asset next to
  # the binaries and backed by a Sigstore SBOM attestation bound to this commit.
  # Consumers verify with `gh attestation verify agav-sbom-<version>.cdx.json
  # --repo prapaa-ai/agav --predicate-type https://cyclonedx.org/bom` (the
  # predicate type is required — the CLI defaults to SLSA provenance, which
  # would reject an SBOM attestation). Does not cover the embedded Bun runtime
  # and its vendored C libraries — those are invisible to the npm dependency
  # graph and are tracked separately by scripts/check-bun-advisories.mjs.
  sbom:
    name: SBOM Generation and Attestation
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # id-token mints the Sigstore OIDC identity; attestations writes the signed
    # SBOM attestation to this repo. contents:read is the default but kept
    # explicit now that the job holds extra scopes.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - run: pnpm install --frozen-lockfile
      - name: Generate CycloneDX SBOM
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: node scripts/gen-sbom.mjs "agav-sbom-${VERSION}.cdx.json"
      - name: Attest SBOM provenance
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          # The subject is the SBOM document itself: the attestation proves this
          # repository's release workflow produced this SBOM from this commit.
          subject-path: agav-sbom-${{ needs.check-version.outputs.version }}.cdx.json
          sbom-path: agav-sbom-${{ needs.check-version.outputs.version }}.cdx.json
      - name: Checksum the SBOM
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          if command -v sha256sum >/dev/null 2>&1; then hash() { sha256sum "$1"; }; else hash() { shasum -a 256 "$1"; }; fi
          hash "agav-sbom-${VERSION}.cdx.json" > "agav-sbom-${VERSION}.cdx.json.sha256"
          cat "agav-sbom-${VERSION}.cdx.json.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agav-sbom
          # 90 days is the maximum workflow-artifact retention for a public
          # repository; requesting more is silently clamped. This copy is a
          # convenience for inspecting a run. The durable, long-lived copy is
          # the SBOM published as a GitHub Release asset below (and mirrored to
          # R2), which lives with the release, not the workflow run.
          retention-days: 90
          path: |
            agav-sbom-${{ needs.check-version.outputs.version }}.cdx.json
            agav-sbom-${{ needs.check-version.outputs.version }}.cdx.json.sha256

  # Validate the release SHA here, not a separate workflow or a PR's merge SHA.
  validation:
    name: Release Validation
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec vitest run
      - name: Shell installer regression tests
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/tests/install-sh.test.sh
          sh scripts/tests/install-sh-path.test.sh

  installer-windows:
    name: Release Windows Installer Tests
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Suites under Windows PowerShell 5.1
        shell: powershell
        run: |
          $Fail = 0
          foreach ($Suite in @("install-ps1.test.ps1", "install-ps1-path.test.ps1")) {
            & powershell -NoProfile -File "scripts\tests\$Suite"
            if ($LASTEXITCODE -ne 0) { $Fail = 1 }
          }
          exit $Fail
      - name: Suites under pwsh 7
        shell: pwsh
        run: |
          $Fail = 0
          foreach ($Suite in @("install-ps1.test.ps1", "install-ps1-path.test.ps1", "install-ps1-lint.test.ps1")) {
            & pwsh -NoProfile -File "scripts\tests\$Suite"
            if ($LASTEXITCODE -ne 0) { $Fail = 1 }
          }
          exit $Fail

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: [check-version, dependency-audit]
    if: needs.check-version.outputs.changed == 'true'
    strategy:
      matrix:
        include:
          - target: darwin-arm64
            os: macos-latest
          - target: darwin-x64
            os: macos-15-intel
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          # Windows binaries must be built natively on a Windows runner.
          # Cross-compiling from Linux (--target=bun-windows-x64 on ubuntu)
          # produces a binary whose embedded Bun runtime does not correctly
          # initialise the Windows console (SetConsoleMode flags), breaking
          # mouse tracking, text selection, copy/paste, and bracketed paste.
          # No windows-arm64: Bun has no such target; ARM64 Windows runs x64
          # under emulation.
          - target: windows-x64
            os: windows-latest
            ext: .exe
          # Baseline variant: Bun's x64 binary now ships a single build that
          # targets Nehalem (SSE4.2) and selects AVX2/AVX-512 code paths at
          # runtime, so -baseline resolves to the same binary. We keep the
          # artifact name for backward compatibility with existing installers.
          # Built natively to avoid Bun's EPERM cache bug on Windows
          # (oven-sh/bun#11198) which breaks --target cross-compilation.
          - target: windows-x64-baseline
            os: windows-latest
            ext: .exe
    runs-on: ${{ matrix.os }}
    # Build provenance attestations: id-token mints the Sigstore OIDC identity,
    # attestations writes the signed attestation to this repo. contents:read is
    # the default; keep it explicit now that the job holds extra scopes.
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      # Build-egress monitoring: install the runner network monitor before any
      # other step so every network call the build makes — dependency
      # resolution, toolchain setup, the compile itself — is recorded and
      # correlated to the process that made it. This is monitoring, not an
      # isolation boundary: `egress-policy: audit` does NOT restrict traffic to
      # an allow-list on any platform (only StepSecurity's global block list of
      # known-malicious endpoints is enforced in audit mode). It runs across the
      # whole matrix (full support on Linux, audit-only on macOS/Windows per the
      # action's compatibility matrix) so it never breaks a cross-platform
      # build, and an unexpected destination in the run's network report is the
      # signal a compromised dependency exfiltrating or fetching a second stage
      # would trip. Enforced isolation (`egress-policy: block` with a pinned
      # allow-list) is the follow-up once a few clean runs establish the
      # legitimate egress baseline; it is deliberately not enabled here because
      # a premature allow-list would break the macOS/Windows legs, where the
      # action cannot enforce anyway.
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-sudo: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          token: ${{ secrets.TOKEN }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      # react-devtools-core is a devDependency and a peer of ink, so
      # `pnpm install` already puts it where Bun's resolver finds it. The
      # separate `bun install` this used to run wrote an extra entry into
      # package.json mid-release for no gain.
      - run: pnpm install --frozen-lockfile
      # The bundled skills are Markdown, so `bun build` cannot carry them along
      # and a compiled binary cannot read them off disk either — it resolves
      # import.meta.url into Bun's virtual filesystem. They are inlined into a
      # generated module instead. This job compiles from source directly rather
      # than through `pnpm build` or build-binary.sh, so it has to regenerate
      # here too, or every published binary ships whatever text was committed.
      - name: Generate bundled skills manifest
        run: node scripts/gen-bundled-skills.mjs
      - name: Build, test and embed native voice helper
        run: |
          VOICE_TARGET=$(node -p 'process.platform + "-" + process.arch')
          VOICE_ASSETS=$(mktemp -d "${RUNNER_TEMP}/voice-assets.XXXXXX")
          trap 'rm -rf "$VOICE_ASSETS"' EXIT
          node scripts/build-voice-helper.mjs "$VOICE_TARGET" "$VOICE_ASSETS"
          HELPER="$VOICE_ASSETS/agav-voice-$VOICE_TARGET"
          if [[ "$VOICE_TARGET" == win32-* ]]; then HELPER="$HELPER.exe"; fi
          node scripts/embed-voice-helper.mjs "$VOICE_TARGET" "$HELPER" source/voice/bundled-runtime.ts
      - name: Build binary
        run: |
          mkdir -p dist
          # Cross-compile for non-native targets. A host-target build embeds
          # whichever native .node addons happen to resolve locally, while the
          # cross toolchain silently drops the ones that do not resolve for
          # the target — which is how the macOS binaries ended up ~27MB
          # heavier than the others and how the two halves of the matrix
          # stopped behaving alike.
          #
          # Both Windows targets build natively (no --target). Cross-compiling
          # from Linux breaks console initialisation, and --target on Windows
          # hits Bun's EPERM cache bug (oven-sh/bun#11198). Since Bun's x64
          # binary now auto-selects AVX2 code paths at runtime, -baseline and
          # the standard build produce the same binary anyway.
          # shellcheck disable=SC2193 # actionlint replaces ${{ matrix.target }} with
          # a fixed placeholder before shellcheck runs, so it wrongly concludes the
          # glob can never match; at runtime matrix.target is the real target string.
          if [[ "${{ matrix.target }}" == windows-* ]]; then
            bun build source/cli.tsx --compile --outfile dist/agav-${{ matrix.target }}${{ matrix.ext }}
          else
            bun build source/cli.tsx --compile --target=bun-${{ matrix.target }} --outfile dist/agav-${{ matrix.target }}${{ matrix.ext }}
          fi
      # Prove — per published artifact, including cross-compiled targets — that it
      # embeds exactly the pinned Bun (the version whose runtime and vendored C
      # libraries check-bun-advisories.mjs vetted in check-version). Trivy is not
      # run on the binary: it cannot advisory-match statically linked C libraries
      # from an SBOM (CycloneDX decoder keys on PURL ecosystem, no CPE path,
      # pkg:generic skipped), so that scan would pass while scanning nothing.
      # This runs BEFORE upload, and publication depends on build-binaries, so a
      # mismatched runtime blocks the release.
      - name: Verify the binary embeds the pinned Bun runtime
        run: node scripts/verify-embedded-runtime.mjs "dist/agav-${{ matrix.target }}${{ matrix.ext }}"
      - name: Sign binary (macOS)
        if: startsWith(matrix.target, 'darwin')
        run: |
          codesign --sign - --force --timestamp dist/agav-${{ matrix.target }}
          echo "macOS ad-hoc signed."

      - name: Sign binary (Linux - cosign)
        if: startsWith(matrix.target, 'linux')
        continue-on-error: true
        run: |
          if command -v cosign >/dev/null 2>&1; then
            cosign sign-blob --yes --output-signature dist/agav-${{ matrix.target }}.sig dist/agav-${{ matrix.target }}
            echo "Linux binary signed with cosign."
          else
            echo "cosign not available, skipping signing."
          fi

      # Run the exact signed artifact on its native runner before publishing it.
      - name: Smoke test release binary
        timeout-minutes: 2
        env:
          BINARY: ./dist/agav-${{ matrix.target }}${{ matrix.ext }}
        run: |
          set -euo pipefail
          EXPECTED=$(node -p "require('./package.json').version")
          ACTUAL=$("$BINARY" --version | tr -d '\r')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Binary version '$ACTUAL' does not match package.json '$EXPECTED'."
            exit 1
          fi
          # Do not use grep -q: drain stdout to avoid a producer SIGPIPE.
          "$BINARY" --help | grep -F "Agav"

      - name: Compress binary
        run: |
          # Published next to the raw binary, never in place of it: installers
          # from earlier releases fetch the bare asset name and have to keep
          # working. gzip rather than tar or zip because every client already
          # decompresses it without an archive parser or any path handling —
          # `gzip -d`, Node's zlib, and PowerShell's GZipStream. -n drops the
          # name and mtime so the same input produces the same bytes.
          cd dist
          gzip -9 -k -n "agav-${{ matrix.target }}${{ matrix.ext }}"
          ls -lh "agav-${{ matrix.target }}${{ matrix.ext }}" "agav-${{ matrix.target }}${{ matrix.ext }}.gz"

      - name: Generate checksums
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then hash() { sha256sum "$1"; }; else hash() { shasum -a 256 "$1"; }; fi
          for asset in "agav-${{ matrix.target }}${{ matrix.ext }}" "agav-${{ matrix.target }}${{ matrix.ext }}.gz"; do
            hash "$asset" > "$asset.sha256"
            cat "$asset.sha256"
          done

      # Build provenance for the EXACT bytes that ship. Generated on the native
      # runner right after checksums, so the attested digests are the published
      # artifacts. Both the raw binary and the gzipped variant are subjects (the
      # installers fetch either). GitHub stores a Sigstore-backed attestation
      # that proves this artifact was built by this workflow from this commit;
      # users verify with `gh attestation verify <file> --repo prapaa-ai/agav`.
      # The detached .sha256/.sig files are not attested — they are not the
      # artifact, and the checksum is redundant with the attested digest.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/agav-${{ matrix.target }}${{ matrix.ext }}
            dist/agav-${{ matrix.target }}${{ matrix.ext }}.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agav-${{ matrix.target }}
          path: |
            dist/agav-${{ matrix.target }}${{ matrix.ext }}
            dist/agav-${{ matrix.target }}${{ matrix.ext }}.sha256
            dist/agav-${{ matrix.target }}${{ matrix.ext }}.gz
            dist/agav-${{ matrix.target }}${{ matrix.ext }}.gz.sha256
            dist/agav-${{ matrix.target }}.sig

  release:
    name: Create Release
    needs: [check-version, dependency-audit, sbom, validation, installer-windows, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          token: ${{ secrets.TOKEN }}
          fetch-depth: 0
      # No README badge commit here. The version badge reads package.json from
      # the default branch through shields.io, so it tracks the release without
      # a commit. The previous step pushed a rewritten badge straight to main,
      # which the branch ruleset rejects with GH013, and it swallowed that
      # failure as a warning — so the badge silently stopped tracking after
      # 0.1.2 while every release still reported success.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Prepare release assets
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          for dir in artifacts/agav-*; do
            target=$(basename "$dir")
            # The SBOM artifact is handled separately below, not as a binary.
            [ "$target" = "agav-sbom" ] && continue
            # The artifact dir is named after the target, but the Windows
            # binary inside it carries a .exe suffix, so try both.
            for asset in "$target" "$target.exe"; do
              [ -f "$dir/$asset" ] || continue
              # Copy binary
              cp "$dir/$asset" "release/$asset"
              chmod +x "release/$asset"
              # Copy the compressed binary, checksums, and signatures
              for ext in sha256 sig gz gz.sha256; do
                if [ -f "$dir/${asset}.${ext}" ]; then
                  cp "$dir/${asset}.${ext}" "release/${asset}.${ext}"
                fi
              done
            done
          done
          # Publish the attested SBOM and its checksum alongside the binaries.
          # Fail closed: the SBOM job is a prerequisite of this job, so both the
          # SBOM and its checksum MUST exist. A missing file here means the
          # attested SBOM would be silently dropped from the release, so stop
          # rather than publish binaries without it.
          SBOM="agav-sbom-${VERSION}.cdx.json"
          for required in "$SBOM" "$SBOM.sha256"; do
            if [ ! -f "artifacts/agav-sbom/$required" ]; then
              echo "::error::Expected SBOM asset artifacts/agav-sbom/$required is missing."
              exit 1
            fi
            cp "artifacts/agav-sbom/$required" "release/$required"
          done
          # Generate combined SHA256SUMS file. Each binary and the SBOM get a
          # line; the detached .sha256 and .sig files do not.
          cd release
          sha256sum agav-* 2>/dev/null | grep -v -e '\.sha256$' -e '\.sig$' -e '\.sigstore$' > SHA256SUMS || true
          cat SHA256SUMS
          cd ..
          ls -lh release/
      - name: Generate release notes
        id: notes
        env:
          CURRENT_TAG: v${{ needs.check-version.outputs.version }}
          PRERELEASE: ${{ needs.check-version.outputs.prerelease }}
        run: |
          # Stable notes are reviewed before merge; beta notes retain the
          # previous applicable ancestor release baseline. No stable git-log fallback.
          NOTES=$(node scripts/release-notes.mjs publish "${CURRENT_TAG#v}")
          # A random delimiter prevents note content from terminating the output.
          DELIMITER="notes_$(node -p 'require("crypto").randomUUID()')"
          {
            echo "notes<<$DELIMITER"
            printf '%s\n' "$NOTES"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"
      # Reconcile the tag BEFORE publishing so the release points at the commit
      # being released now, not a stale commit from a prior failed attempt.
      # softprops/action-gh-release creates the tag if absent but will NOT move
      # an existing one, so a recovery run (fix on a new commit, same version)
      # would otherwise publish assets against the broken commit's tree.
      #   - no tag                -> leave it; the release action creates it.
      #   - tag already at HEAD   -> leave it (idempotent).
      #   - tag elsewhere, no non-draft release -> move it to this commit
      #     (the earlier attempt never completed, so moving it is safe).
      #   - tag elsewhere, non-draft release exists -> only move it when force
      #     was requested, protecting a genuinely published release.
      - name: Reconcile release tag
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
          TAG: v${{ needs.check-version.outputs.version }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          EXISTING=$(git rev-parse -q --verify "refs/tags/$TAG" || echo "")
          if [ -z "$EXISTING" ]; then
            echo "No existing tag $TAG; the release step will create it at $SHA."
            exit 0
          fi
          if [ "$EXISTING" = "$SHA" ]; then
            echo "Tag $TAG already points at $SHA; nothing to reconcile."
            exit 0
          fi
          PUBLISHED=false
          if gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
               --jq '.draft' > /tmp/reconcile_draft 2>/dev/null; then
            [ "$(cat /tmp/reconcile_draft)" = "false" ] && PUBLISHED=true
          fi
          if [ "$PUBLISHED" = "true" ] && [ "$FORCE" != "true" ]; then
            echo "::error::Tag $TAG exists at $EXISTING and backs a published release. Re-run with force to overwrite."
            exit 1
          fi
          echo "Moving stale tag $TAG from $EXISTING to $SHA (prior attempt incomplete or force requested)."
          git tag -f "$TAG" "$SHA"
          git push -f origin "refs/tags/$TAG"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          prerelease: ${{ needs.check-version.outputs.prerelease == 'true' }}
          target_commitish: ${{ github.sha }}
          body: |
            ## Changes

            ${{ steps.notes.outputs.notes }}

            ## Installation

            Both installers verify the SHA-256 checksum of the download and
            refuse to install if it does not match.

            ### macOS / Linux

            ```bash
            curl -fsSL https://agav.dev/install.sh | bash
            ```

            ### Windows

            ```powershell
            irm https://www.agav.dev/install.ps1 | iex
            ```

            The `www.` is deliberate: the apex answers with a 308 and Windows
            PowerShell 5.1 cannot follow that status.

            ### Verify build provenance (optional)

            Every binary carries a GitHub-signed build-provenance attestation
            proving it was built by this repository's release workflow from this
            release's commit. Constrain the check to the signer workflow and the
            source commit, not just the repository, with the
            [GitHub CLI](https://cli.github.com):

            ```bash
            gh attestation verify agav-darwin-arm64 \
              --repo ${{ github.repository }} \
              --signer-workflow ${{ github.repository }}/.github/workflows/release.yml \
              --source-digest ${{ github.sha }}
            ```

            Works on the raw binary or the `.gz` before decompressing. If
            verification fails, do not run the file until the failure is
            resolved — treat an unverified artifact as untrusted (a failure can
            also be a network or authentication problem, not only tampering).

            ### Software Bill of Materials (SBOM)

            This release publishes a CycloneDX SBOM of its production dependency
            graph as `agav-sbom-${{ needs.check-version.outputs.version }}.cdx.json`,
            backed by a GitHub-signed SBOM attestation bound to this commit:

            ```bash
            gh attestation verify agav-sbom-${{ needs.check-version.outputs.version }}.cdx.json \
              --repo ${{ github.repository }} \
              --predicate-type https://cyclonedx.org/bom \
              --signer-workflow ${{ github.repository }}/.github/workflows/release.yml \
              --source-digest ${{ github.sha }}
            ```

            The `--predicate-type` is required: `gh attestation verify`
            defaults to SLSA provenance, but an SBOM attestation carries a
            CycloneDX predicate, so the default would reject a valid SBOM.

            The SBOM covers the npm dependency graph only. The embedded Bun
            runtime and its vendored C libraries are not in that graph and are
            tracked separately by the release's runtime advisory gate.

            <details>
            <summary>Manual install</summary>

            Every binary is also published gzipped as `<asset>.gz`, about a
            third of the size. The installers fetch that and fall back to the
            raw asset; the digest below is the raw asset's either way, so
            verify after decompressing.

            **macOS / Linux** — pick one of `agav-darwin-arm64`,
            `agav-darwin-x64`, `agav-linux-x64`, `agav-linux-arm64`.

            ```bash
            BASE="https://github.com/${{ github.repository }}/releases/download/v${{ needs.check-version.outputs.version }}"
            ASSET="agav-darwin-arm64"

            curl -fsSL "$BASE/$ASSET" -o agav
            curl -fsSL "$BASE/$ASSET.sha256" -o agav.sha256

            # Fail closed: install nothing unless the published digest matches.
            if command -v sha256sum >/dev/null 2>&1; then CHECK="sha256sum -c"; else CHECK="shasum -a 256 -c"; fi
            if sed "s| $ASSET| agav|" agav.sha256 | $CHECK -; then
              chmod +x agav && sudo mv agav /usr/local/bin/agav
            else
              echo "Checksum mismatch - refusing to install." && rm -f agav
            fi
            rm -f agav.sha256
            ```

            **Windows** — x64 only; ARM64 runs the x64 build under emulation.
            Close any running agav first: Windows will not let a loaded .exe be
            overwritten.

            ```powershell
            $dir = "$env:LOCALAPPDATA\agav"
            $base = "https://github.com/${{ github.repository }}/releases/download/v${{ needs.check-version.outputs.version }}"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null

            # .NET below 4.7 negotiates TLS 1.0, which github.com refuses.
            # -UseBasicParsing keeps this off the IE engine, absent on Server Core.
            [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
            Invoke-WebRequest -UseBasicParsing -Uri "$base/agav-windows-x64.exe" -OutFile "$dir\agav.exe.tmp"

            # Verify before running it. Fail closed.
            $expected = (((Invoke-WebRequest -UseBasicParsing -Uri "$base/agav-windows-x64.exe.sha256").Content) -split '\s+')[0]
            if ((Get-FileHash "$dir\agav.exe.tmp" -Algorithm SHA256).Hash -ne $expected.ToUpperInvariant()) {
              Remove-Item "$dir\agav.exe.tmp" -Force
              throw "Checksum mismatch - refusing to install."
            }
            Move-Item "$dir\agav.exe.tmp" "$dir\agav.exe" -Force

            # Add to PATH (run once). Write the registry value directly:
            # [Environment]::GetEnvironmentVariable returns PATH already expanded,
            # so writing it back bakes every %USERPROFILE%-style entry into a
            # literal path and flattens a REG_EXPAND_SZ PATH permanently.
            $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey("Environment", $true)
            $raw = [string]$key.GetValue("PATH", "", [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
            $kind = if ($raw) { $key.GetValueKind("PATH") } else { [Microsoft.Win32.RegistryValueKind]::ExpandString }
            # Compare whole segments. `-like "*$dir*"` treats $dir as a wildcard
            # pattern and matches substrings, so an unrelated "C:\agav-old"
            # already on PATH would silently suppress the edit.
            $onPath = @($raw.Split(';') | Where-Object { $_.Trim().Trim('"').TrimEnd('\') -eq $dir }).Count -gt 0
            if (-not $onPath) {
              $key.SetValue("PATH", $(if ($raw) { "$dir;$raw" } else { $dir }), $kind)
            }
            $key.Close()
            $env:PATH = "$dir;$env:PATH"
            ```

            </details>
          generate_release_notes: false
          files: release/*

      # Mirror every published asset to Cloudflare R2 so releases.agav.dev can
      # serve them as the primary source, with GitHub Releases as the fallback
      # (see docs/deploy/releases-mirror-setup.md and
      # docs/deploy/releases-worker/). Runs AFTER the GitHub Release is created,
      # so the fallback origin is never empty while R2 is being populated. If
      # the R2 credentials are absent (e.g. on a fork), the sync is skipped
      # rather than failing the release.
      - name: Mirror release assets to R2
        env:
          TAG: v${{ needs.check-version.outputs.version }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCESS_KEY_ID:-}" ]; then
            echo "R2 credentials not configured — skipping R2 mirror."
            exit 0
          fi
          # Do not resolve the application's pnpm-managed peer graph with npm.
          MIRROR_DIR=$(mktemp -d "${RUNNER_TEMP}/agav-r2-mirror.XXXXXX")
          trap 'rm -rf "$MIRROR_DIR"' EXIT
          npm install --prefix "$MIRROR_DIR" --no-save --package-lock=false --ignore-scripts @aws-sdk/client-s3@3.1146.0
          # ESM resolves packages relative to the script, not the working dir.
          cp scripts/mirror-release-to-r2.mjs "$MIRROR_DIR/"
          node "$MIRROR_DIR/mirror-release-to-r2.mjs" "$TAG" "$PWD/release"
