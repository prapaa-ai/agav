name: Sandbox Enforcement (per-OS)

# Proves the OS-level sandbox actually restricts filesystem/network/process
# access — the enforcement half of #2. The unit suite mocks child_process and
# only checks argument shape; this job runs the REAL backend on each native
# runner so the restriction assertions in sandbox-enforcement.test.ts execute
# for real (they report a skip, not a pass, on any runner where the backend
# cannot apply — so a silently-disabled sandbox cannot hide here).
#
# Runs on PRs that touch the sandbox path and on every push to main/beta.

on:
  pull_request:
    branches: [main, beta]
    paths:
      - "source/utils/sandbox.ts"
      - "source/utils/sandbox-startup.ts"
      - "source/tools/shell.ts"
      - "source/tools/background-job.ts"
      - "source/__tests__/sandbox-enforcement.test.ts"
      - "source/__tests__/sandbox-fail-closed-enforcement.test.ts"
      - "source/__tests__/background-job-consent-boundary.test.ts"
      - ".github/workflows/sandbox-enforcement.yml"
  push:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  enforce:
    name: Enforcement (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9
      # Install bubblewrap on Linux so the backend actually applies there.
      # ubuntu-latest is now 24.04, where AppArmor blocks unprivileged user
      # namespaces by default (kernel.apparmor_restrict_unprivileged_userns=1),
      # which makes bwrap fail to create its sandbox. Relax that sysctl for the
      # runner so bwrap applies and the enforcement assertions actually execute
      # — otherwise they would merely report a skip and prove nothing on Linux.
      # macOS ships sandbox-exec; Windows has no OS sandbox and the
      # Windows-specific assertions cover the no-sandbox path.
      - name: Install bubblewrap and enable it to sandbox (Linux)
        if: runner.os == 'Linux'
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # ubuntu-latest is 24.04 (noble), where AppArmor gates unprivileged user
          # namespaces, so plain bwrap fails with "Creating new namespace failed:
          # Permission denied". The documented reliable fix on 24.04 is to make the
          # bwrap binary setuid (it then uses the privileged setup path; the sandbox
          # restrictions it enforces are identical). We also relax the sysctls as a
          # belt-and-braces measure for other kernels.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo chmod u+s "$(command -v bwrap)"
          bwrap --version
          # Fail the job if bwrap cannot apply the FULL production-style profile:
          # a silent skip would hide a real Linux enforcement regression behind a
          # green check. Mirror the shape runBubblewrap uses (ro-bind root, dev,
          # proc, tmpfs, chdir).
          probe="$(mktemp -d)"
          bwrap --ro-bind / / --bind "$probe" "$probe" --tmpfs /tmp --dev /dev --proc /proc \
            --tmpfs "$HOME/.ssh" --die-with-parent --chdir "$probe" /bin/sh -c 'echo bwrap_ok'
          echo "bwrap applies on this runner."
      - run: pnpm install --frozen-lockfile
      - name: Run per-OS sandbox enforcement tests
        run: >-
          npx vitest run
          source/__tests__/sandbox-enforcement.test.ts
          source/__tests__/sandbox-fail-closed-enforcement.test.ts
          source/__tests__/background-job-consent-boundary.test.ts
          --reporter=verbose
          --reporter=json --outputFile=enforcement-report.json
      # A green test run is NOT enough: the per-OS assertions self-skip when the
      # backend cannot apply, so a runner where the sandbox silently failed would
      # still pass. Assert that THIS runner's owning backend suite actually
      # EXECUTED its restriction tests (none skipped) — turning a silent skip on
      # the owning runner into a hard failure.
      - name: Assert this runner's backend enforcement actually executed
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   SUITE="macOS Seatbelt" ;;
            Linux)   SUITE="Linux Bubblewrap" ;;
            Windows) SUITE="Windows (no OS sandbox)" ;;
            *) echo "::error::unexpected runner OS"; exit 1 ;;
          esac
          node -e '
            const fs = require("fs");
            const suite = process.argv[1];
            const report = JSON.parse(fs.readFileSync("enforcement-report.json", "utf8"));
            // Flatten assertion results; vitest JSON uses testResults[].assertionResults[].
            const all = (report.testResults || []).flatMap(f => f.assertionResults || []);
            const owning = all.filter(a => (a.ancestorTitles || []).some(t => t === suite) || (a.fullName || "").includes(suite));
            const ran = owning.filter(a => a.status === "passed");
            const skipped = owning.filter(a => a.status === "skipped" || a.status === "pending");
            console.log(`${suite}: ${ran.length} executed, ${skipped.length} skipped`);
            if (owning.length === 0) {
              console.error(`::error::No tests found for owning suite "${suite}"`);
              process.exit(1);
            }
            if (ran.length === 0) {
              console.error(`::error::Owning suite "${suite}" executed 0 restriction tests (all skipped) — the sandbox did not apply on this runner.`);
              process.exit(1);
            }
            if (skipped.length > 0) {
              console.error(`::error::Owning suite "${suite}" had ${skipped.length} skipped test(s); every restriction test must run on its native runner.`);
              process.exit(1);
            }
          ' "$SUITE"
