name: Secret Scan (Gitleaks)

# Full secret-leak detection with Gitleaks, replacing the regex-only heuristic
# that lived in pr-checks.yml. Two surfaces:
#   - PR: scan only the commits the PR introduces (base..head), so review time
#     stays low and a contributor is told immediately when a push adds a secret.
#   - Scheduled + push to main/beta: scan the FULL git history, catching a secret
#     that was committed earlier and only later recognised as one (or that slipped
#     in through a path the diff-scoped PR run did not cover).
#
# The tool is not a GitHub Action (no `uses:` for gitleaks): it is downloaded as a
# pinned release tarball and verified against a recorded SHA-256 before it runs, so
# a moved tag or a compromised action release cannot alter what executes. This
# mirrors how the repo already vets the embedded Bun runtime — trust the bytes,
# not a mutable ref. gitleaks-action is also org-licensed for private orgs; the
# raw binary has no such constraint.

on:
  pull_request:
    branches: [main, beta]
  push:
    branches: [main, beta]
  schedule:
    # Daily full-history sweep so a newly recognised secret pattern (or one that
    # predates this workflow) is still caught even with no new commits.
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  # linux_x64 tarball SHA-256 from the v8.30.1 release checksums. Bump both this
  # and GITLEAKS_VERSION together; a mismatch fails the install step closed.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.TOKEN || github.token }}
          # A PR run scopes to base..head below, so it does not need full history.
          # Every other trigger scans the whole history and must fetch all of it.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false
      - name: Install Gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 -o "$tarball" "$url"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" gitleaks
          chmod +x gitleaks
          ./gitleaks version
      - name: Scan pull request range
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # --log-opts restricts the scan to the commits this PR adds. Fail-closed:
        # gitleaks exits non-zero when it finds a leak, which fails the job.
        run: |
          ./gitleaks git . \
            --log-opts="${BASE}..${HEAD}" \
            --redact \
            --no-banner \
            --verbose
      - name: Scan full history
        if: github.event_name != 'pull_request'
        run: |
          ./gitleaks git . \
            --redact \
            --no-banner \
            --verbose
