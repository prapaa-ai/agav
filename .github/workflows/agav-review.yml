name: Agav PR Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AGAV_APP_ID }}
          private-key: ${{ secrets.AGAV_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Install Agav
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release download --repo ${{ github.repository }} --pattern 'agav-linux-x64' --dir /tmp
          install -m 755 /tmp/agav-linux-x64 /usr/local/bin/agav

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > /tmp/pr-diff.txt

      - name: Review with Agav
        timeout-minutes: 3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGAV_NO_SANDBOX: "1"
        run: |
          head -c 30000 /tmp/pr-diff.txt | agav -P "Review this PR diff (provided via stdin) for bugs, security issues, and breaking changes only. Be concise. If no issues, say LGTM." --provider gemini --model gemini-3.5-flash-lite > review.md

      - name: Post review
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ ! -f review.md ]; then exit 0; fi
          REVIEW=$(cat review.md)
          if [ -n "$REVIEW" ]; then
            gh pr review ${{ github.event.pull_request.number }} --comment --body "$REVIEW"
          fi
